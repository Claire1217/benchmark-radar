name: Report incorrect metadata
description: Correct a field or false positive with source evidence.
title: "[Correction] "
labels: [metadata-correction]
body:
  - type: input
    id: benchmark
    attributes:
      label: Benchmark or record URL
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: Affected field
      options:
        - Name or duplicate
        - Domain or capability
        - What it measures or domain
        - Resource link
        - Readiness
        - Conference or publication status
        - Attention metric
        - False positive
        - Other
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Primary-source evidence URL
    validations:
      required: true
