name: AI candidate review (shadow)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum candidates to review
        required: true
        default: "24"
        type: choice
        options:
          - "12"
          - "24"
          - "48"
          - "96"
      batch_size:
        description: Candidates per model request
        required: true
        default: "12"
        type: choice
        options:
          - "6"
          - "12"

# Deliberately read-only: this workflow must never commit or publish a model
# decision. The only output is a short-lived Actions artifact for human review.
permissions:
  contents: read

concurrency:
  group: ai-candidate-review-shadow
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCHMARK_LLM_API_KEY: ${{ secrets.BENCHMARK_LLM_API_KEY }}
      BENCHMARK_LLM_BASE_URL: ${{ vars.BENCHMARK_LLM_BASE_URL }}
      BENCHMARK_LLM_MODEL: ${{ vars.BENCHMARK_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.148.0-alpha.9

      - name: Check provider configuration
        shell: bash
        run: |
          set +x
          test -n "$BENCHMARK_LLM_API_KEY" || { echo "Missing required Actions secret" >&2; exit 1; }
          test -n "$BENCHMARK_LLM_BASE_URL" || { echo "Missing required repository variable" >&2; exit 1; }
          test -n "$BENCHMARK_LLM_MODEL" || { echo "Missing required repository variable" >&2; exit 1; }

      - name: Review candidates in shadow mode
        shell: bash
        run: |
          set +x
          mkdir -p artifacts
          python pipeline/review_candidates_with_codex.py \
            --input data/review_queue.json \
            --output artifacts/ai_reviews.json \
            --limit "${{ inputs.limit }}" \
            --batch-size "${{ inputs.batch_size }}"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-shadow-${{ github.run_id }}
          path: artifacts/ai_reviews.json
          if-no-files-found: error
          retention-days: 14
