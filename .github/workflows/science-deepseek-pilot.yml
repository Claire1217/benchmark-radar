name: Science provenance DeepSeek pilot
on:
  push:
    branches: [experiment/science-deepseek-pilot-20260915]
    paths:
      - experiments/science-provenance-pilot/deepseek_run.py
      - .github/workflows/science-deepseek-pilot.yml
permissions:
  contents: write
concurrency:
  group: science-deepseek-pilot-20260915
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pypdf==6.0.0
      - name: Four independent API extractions
        id: extract
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python experiments/science-provenance-pilot/deepseek_run.py --run
      - name: Preserve evidence and outputs on experiment branch
        if: always()
        run: |
          git config user.name "benchmark-radar-bot"
          git config user.email "benchmark-radar-bot@users.noreply.github.com"
          if [ -d experiments/science-provenance-pilot/deepseek-results ]; then
            git add experiments/science-provenance-pilot/deepseek-results
            if ! git diff --cached --quiet; then
              git commit -m "experiment: record DeepSeek provenance pilot outputs"
              git push origin HEAD:experiment/science-deepseek-pilot-20260915
            fi
          fi
      - name: Report extraction failure
        if: steps.extract.outcome == 'failure'
        run: exit 1

