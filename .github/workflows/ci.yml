name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test data and pipeline
        run: make test
      - name: Build and test Pages artifact
        run: make build
      - name: Audit workflow coverage and actual Library retrieval
        run: |
          python3 pipeline/audit_workflow.py --output outputs/workflow-audit.json
          python3 pipeline/evaluate_search.py > outputs/shared-search-evaluation.json
      - name: Preserve workflow diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-audit
          path: |
            outputs/workflow-audit.json
            outputs/shared-search-evaluation.json
          if-no-files-found: ignore
