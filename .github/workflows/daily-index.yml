name: Daily benchmark index

on:
  schedule:
    # Publish one reviewed morning batch for the previous Brisbane calendar
    # day. A later idempotent retry catches transient source or model outages.
    # Lightweight Today-only attention refreshes run separately.
    - cron: "0 9 * * *"
      timezone: "Australia/Brisbane"
    - cron: "30 11 * * *"
      timezone: "Australia/Brisbane"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional first-release date in YYYY-MM-DD"
        required: false
        type: string
      metrics_only:
        description: "Refresh public attention without discovery or AI review"
        required: false
        default: false
        type: boolean
      audit_names_from:
        description: "Optional earliest release date for a source-grounded canonical-name audit"
        required: false
        type: string
      review_ids:
        description: "Optional comma-separated source IDs to review immediately"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: benchmark-publish-pipeline
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main after waiting in the queue
        run: |
          git fetch origin main
          git switch --detach origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve previous Brisbane calendar day
        if: ${{ inputs.metrics_only != true }}
        id: source-date
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          target="${REQUESTED_DATE:-$(python pipeline/scheduled_source_date.py)}"
          echo "date=$target" >> "$GITHUB_OUTPUT"
          echo "start=$(python pipeline/scheduled_source_date.py --target "$target" --batch-start)" >> "$GITHUB_OUTPUT"
          echo "review_start=$(python -c 'from datetime import date,timedelta; import sys; print((date.fromisoformat(sys.argv[1])-timedelta(days=89)).isoformat())' "$target")" >> "$GITHUB_OUTPUT"
      - name: Discover one unified public-source batch
        if: ${{ inputs.metrics_only != true }}
        id: discovery
        continue-on-error: true
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          SCHEDULED_DATE: ${{ steps.source-date.outputs.date }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENREVIEW_TOKEN: ${{ secrets.OPENREVIEW_TOKEN }}
        run: |
          python pipeline/discover_benchmarks.py --date "${REQUESTED_DATE:-$SCHEDULED_DATE}"
          python -c 'import json; print("indexed_date=" + json.load(open("data/review_queue.json"))["sourceDate"])' >> "$GITHUB_OUTPUT"

      - name: Report discovery status
        if: ${{ inputs.metrics_only != true && steps.discovery.outcome == 'failure' }}
        run: echo "::warning::Unified discovery failed; continuing with the last validated index so publication and attention data still refresh."

      - name: Automatically admit high-confidence benchmark releases
        if: ${{ inputs.metrics_only != true }}
        run: python pipeline/auto_admit_candidates.py

      - name: Optionally enrich remaining candidates and public copy
        if: ${{ inputs.metrics_only != true }}
        id: editorial-review
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Admission is the high-judgment step; use Pro here. Routine copy
          # backfill below stays on Flash to keep the daily cost small.
          DEEPSEEK_COPY_MODEL: deepseek-v4-pro
          REQUESTED_DATE: ${{ inputs.date }}
          SCHEDULED_DATE: ${{ steps.source-date.outputs.date }}
          BATCH_START: ${{ steps.source-date.outputs.start }}
          INDEXED_DATE: ${{ steps.discovery.outputs.indexed_date }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured; deterministic admission already completed."
          else
            target="${REQUESTED_DATE:-${INDEXED_DATE:-$SCHEDULED_DATE}}"
            python pipeline/generate_editorial_copy.py --review-queue --released-from "$BATCH_START" --released-through "$target" --limit 0 --batch-size 8
          fi

      - name: Review requested source IDs immediately
        if: ${{ inputs.metrics_only != true && inputs.review_ids != '' }}
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_COPY_MODEL: deepseek-v4-pro
          REVIEW_IDS: ${{ inputs.review_ids }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python pipeline/generate_editorial_copy.py --review-queue --ids "$REVIEW_IDS" --limit 0 --batch-size 8
          fi

      - name: Review rolling 90-day candidate backlog
        if: ${{ inputs.metrics_only != true }}
        id: rolling-candidate-review
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_COPY_MODEL: deepseek-v4-pro
          REVIEW_START: ${{ steps.source-date.outputs.review_start }}
          REVIEW_END: ${{ steps.source-date.outputs.date }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python pipeline/generate_editorial_copy.py --review-queue --released-from "$REVIEW_START" --released-through "$REVIEW_END" --limit 64 --batch-size 8
          fi

      - name: Audit rolling 90-day public records
        if: ${{ inputs.metrics_only != true }}
        id: rolling-public-audit
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_COPY_MODEL: deepseek-v4-pro
          REVIEW_START: ${{ steps.source-date.outputs.review_start }}
          REVIEW_END: ${{ steps.source-date.outputs.date }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python pipeline/generate_editorial_copy.py --review-public --released-from "$REVIEW_START" --released-through "$REVIEW_END" --limit 64 --batch-size 8
          fi

      - name: Report editorial review status
        if: ${{ inputs.metrics_only != true && steps.editorial-review.outcome == 'failure' }}
        run: echo "::warning::Editorial review service failed; keeping candidates queued for the later daily retry."

      - name: Audit published canonical names
        if: ${{ inputs.metrics_only != true && inputs.audit_names_from != '' }}
        id: canonical-name-audit
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_COPY_MODEL: deepseek-v4-pro
          AUDIT_NAMES_FROM: ${{ inputs.audit_names_from }}
          REQUESTED_DATE: ${{ inputs.date }}
          SCHEDULED_DATE: ${{ steps.source-date.outputs.date }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::warning::DEEPSEEK_API_KEY is not configured; canonical names were not audited."
          else
            python pipeline/generate_editorial_copy.py --review-curated --first-seen-from "$AUDIT_NAMES_FROM" --first-seen-through "${REQUESTED_DATE:-$SCHEDULED_DATE}" --limit 0 --batch-size 8
          fi

      - name: Report canonical-name audit status
        if: ${{ inputs.metrics_only != true && inputs.audit_names_from != '' && steps.canonical-name-audit.outcome == 'failure' }}
        run: echo "::warning::Canonical-name audit failed; existing validated records remain unchanged."

      - name: Continue editorial backfill
        if: ${{ inputs.metrics_only != true }}
        id: editorial-backfill
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_COPY_MODEL: deepseek-v4-flash
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python pipeline/generate_editorial_copy.py --limit 48 --batch-size 8
          fi

      - name: Report editorial backfill status
        if: ${{ inputs.metrics_only != true && steps.editorial-backfill.outcome == 'failure' }}
        run: echo "::warning::Editorial backfill failed; continuing with validated canonical records."

      - name: Reconcile reviewed records before enrichment
        if: ${{ inputs.metrics_only != true }}
        run: python pipeline/apply_overrides.py

      - name: Refresh publication and acceptance metadata
        if: ${{ inputs.metrics_only != true }}
        run: python pipeline/enrich_publications.py

      - name: Snapshot public attention metrics
        id: attention_metrics
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python pipeline/enrich_metrics.py

      - name: Report attention metrics status
        if: ${{ steps.attention_metrics.outcome == 'failure' }}
        run: echo "::warning::Attention metrics refresh failed; continuing with the last validated snapshot."

      - name: Refresh complete public benchmark catalogs
        if: ${{ inputs.metrics_only != true }}
        continue-on-error: true
        run: python pipeline/sync_catalogs.py

      - name: Generate public views once
        run: make generate

      - name: Validate site
        run: make build

      - name: Commit canonical data
        run: |
          git config user.name "benchmark-radar-bot"
          git config user.email "benchmark-radar-bot@users.noreply.github.com"
          git add README.md AWESOME_BENCHMARKS.md data/benchmarks.json data/benchmarks_index.json data/catalog_records.json data/editorial_copy.json data/library_records.json data/library_index.json data/curated_overrides.json data/curated_records.json data/domain_trends.json data/review_queue.json data/runs data/metrics data/publication
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "data: update benchmark index"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
