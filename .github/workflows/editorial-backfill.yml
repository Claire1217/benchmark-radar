name: Backfill benchmark descriptions and publishers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial-backfill.yml"

permissions:
  contents: write

concurrency:
  group: benchmark-publish-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Process every pending benchmark
        id: editorial
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_COPY_MODEL: deepseek-v4-flash
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$DEEPSEEK_API_KEY"
          python pipeline/generate_editorial_copy.py --limit 0 --batch-size 8

      - name: Rebuild from completed batches
        run: |
          python pipeline/apply_overrides.py
          make generate
          make build

      - name: Commit completed batches
        run: |
          git config user.name "benchmark-radar-bot"
          git config user.email "benchmark-radar-bot@users.noreply.github.com"
          git add README.md AWESOME_BENCHMARKS.md data/benchmarks.json data/benchmarks_index.json data/editorial_copy.json data/library_index.json data/domain_trends.json
          if git diff --cached --quiet; then
            echo "No editorial changes"
          else
            git commit -m "data: backfill benchmark descriptions and publishers"
            git push
          fi

      - name: Report partial completion
        if: steps.editorial.outcome == 'failure'
        run: echo "::warning::The backfill stopped early. Completed batches were saved; the daily job will resume the remainder."
